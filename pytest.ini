[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Disable pytest's FD/sys capture entirely.
# import pygame on Windows replaces the C-level stdout FD, which breaks both
# fd-level and sys-level capture teardown with "underlying buffer has been
# detached". The suite asserts on return values, not captured output, so
# --capture=no is safe and produces clean runs.
addopts = --capture=no
